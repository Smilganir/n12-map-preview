<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone evidence</title><style>body{font:14px monospace;overflow-wrap:anywhere}p{border-bottom:1px solid #bbb}</style><h3>Preview phone evidence</h3><div id="out"></div><script>const a=JSON.parse(localStorage.getItem('n12-isolation-events-v1')||'[]');document.querySelector('#out').textContent='';for(const e of a.filter(e=>e.type!=='error').slice(-70).reverse()){let p=document.createElement('p');p.textContent=[e.time.slice(11,23),e.id,e.kind,e.mode,e.type,e.navigation,e.text,e.message,e.source?e.source+' features='+e.features:undefined,e.name?e.name:undefined,e.group?e.group:undefined,e.build?'lite='+e.build.lite+' build='+JSON.stringify(e.build):''].filter(x=>x!==undefined).join(' | ');document.querySelector('#out').append(p)}</script>
